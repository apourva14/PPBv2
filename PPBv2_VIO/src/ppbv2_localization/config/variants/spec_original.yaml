# The spec's original ekf_local settings ("Concrete robot_localization configuration"), to
# reproduce the comparison: IMU gyro + accel, wheel vx + vyaw only, no VIO rejection
# threshold. On Rosario v1 seq02 this diverges after the VIO is dropped (ATE 173 m).
ekf_local:
  ros__parameters:
    imu0_config: [false, false, false,  false, false, false,  false, false, false,
                  true, true, true,  true, true, true]
    odom0_config: [false, false, false,  false, false, false,  true, false, false,
                   false, false, true,  false, false, false]
    odom1_pose_rejection_threshold: 1.7976931348623157e+308
    odom1_twist_rejection_threshold: 1.7976931348623157e+308
