# OpenVINS on PPBv2 (Amiga, Jetson AGX Orin, stereo navigation camera + hardware-synced IMU).
# Estimator settings: upstream config/euroc_mav from the pinned install, changed only by the
# overrides below. Camera and IMU calibration: generated by tools/kalibr_to_openvins.py from
# the robot's Kalibr + Allan-variance results (launch with calibration_dir:=<calibration>/openvins).
#
# Every override is a lesson from field data (Rosario v1, a soybean-field ground robot,
# offline bench on sequence02, 2026-10-23..26); re-validate on PPBv2 recordings (spec, Task 7).
estimator: openvins
upstream:
  package: ov_msckf
  config_dir: config/euroc_mav
  entry_file: estimator_config.yaml
calibration_files: [kalibr_imucam_chain.yaml, kalibr_imu_chain.yaml]
forbidden_files: []
overrides:
  - {file: kalibr_imucam_chain.yaml, section: cam0, key: rostopic, value: /vio/cam0/image_raw}
  - {file: kalibr_imucam_chain.yaml, section: cam1, key: rostopic, value: /vio/cam1/image_raw}
  - {file: kalibr_imu_chain.yaml, section: imu0, key: rostopic, value: /vio/imu}
  # Ground vehicle: planar, low-rotation motion does not constrain camera-IMU extrinsics.
  # Online calibration drifted the stereo baseline 0.120 -> 0.170 m in 20 s (scale x1.43).
  # The Kalibr calibration is held fixed; the time offset is still refined (stayed 1-3 ms).
  - {file: estimator_config.yaml, section: '', key: calib_cam_extrinsics, value: false}
  - {file: estimator_config.yaml, section: '', key: calib_cam_intrinsics, value: false}
  # Start-up: the Amiga normally starts at rest (static initialization). If the VIO is
  # (re)started while driving, dynamic initialization takes over; on a field robot the
  # median rotation in its 2 s window is ~1.7 deg, so the upstream 10 deg would rarely fire.
  - {file: estimator_config.yaml, section: '', key: init_dyn_use, value: true}
  - {file: estimator_config.yaml, section: '', key: init_dyn_min_deg, value: 5.0}
  # Vibration on soil and repetitive crop rows: 2 px feature noise and 300 points per
  # camera (Rosario ATE 6.25 -> 3.03 m, worst error 23.8 -> 7.1 m).
  - {file: estimator_config.yaml, section: '', key: up_msckf_sigma_px, value: 2.0}
  - {file: estimator_config.yaml, section: '', key: up_slam_sigma_px, value: 2.0}
  - {file: estimator_config.yaml, section: '', key: num_pts, value: 300}
  # Track every frame of a 30 Hz navigation camera (upstream tracks at most 21 Hz).
  # Lower it only if the Orin cannot keep up (see the bench's processing-time report).
  - {file: estimator_config.yaml, section: '', key: track_frequency, value: 31.0}
  - {file: estimator_config.yaml, section: '', key: record_timing_information, value: true}
  - {file: estimator_config.yaml, section: '', key: record_timing_filepath, value: "{run_dir}/estimator/timing.txt"}
output:
  odom_topic: /ov_msckf/odomimu
  # OpenVINS fills twist.linear with the IMU velocity expressed in the IMU frame.
  linear_velocity_frame: child
