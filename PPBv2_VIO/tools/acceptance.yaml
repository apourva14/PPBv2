# Sanity gates for dataset replays (EuRoC MAV, TUM-VI). These catch a broken pipeline (bad config,
# wrong frames/timestamps, tracking loss); they are not performance targets.
# Published stereo VIO results on these sequences are typically < 0.1 m APE.
default:
  max_ape_rmse_m: 0.30
  max_init_latency_s: 15.0
  min_coverage: 0.95
  min_matched_poses: 500

V1_01_easy:
  max_ape_rmse_m: 0.15
  max_init_latency_s: 10.0
  min_coverage: 0.98
  min_matched_poses: 1000

MH_01_easy:
  max_ape_rmse_m: 0.25
  # The MAV is picked up and set down at the start; initialization waits for motion.
  max_init_latency_s: 40.0
  min_coverage: 0.95
  min_matched_poses: 1000

dataset-room1_512_16:
  max_ape_rmse_m: 0.15
  max_init_latency_s: 15.0
  min_coverage: 0.98
  min_matched_poses: 1000

# Rosario v1 (soybean field, ground robot, position-only RTK ground truth at the GPS antenna).
# Sanity gate for VIO alone, not the fusion acceptance gate: well under the wheel-odometry
# dead-reckoning baseline on this sequence (4.42 m). Systems in the CIFASIS VIO evaluation
# reached ~0.5 m (crop-row spacing) at best. The robot drives from the first frame, so
# start-up needs dynamic initialization; 15 s allows for it.
rosario_v1_sequence02:
  max_ape_rmse_m: 2.0
  max_init_latency_s: 15.0
  min_coverage: 0.95
  min_matched_poses: 1000
